# Source-authority and retention-class registry (MSRC-002/MSRC-003 support).
#
# `covered: true` entries must match, field for field, an entry
# internal/intent/model/catalog.go's authorityCatalog()/retentionCatalog()
# compiles into internal/intent/model.Catalog(). tools/gen/schemaflux/sources
# cross-checks every covered entry against that live registry
# (CrossCheckModel); a mismatch or a covered entry with no Go counterpart is
# a reported mismatch, never a silently accepted drift.
#
# `covered: false` entries are forward declarations for a family (e.g.
# assurance, operations, dataops) whose authority/retention posture is
# planned but not yet registered in Go. Property entries in
# schema/schemaflux/entities/v1/**.yaml may reference either kind, but a
# property whose own status is ACTIVE must reference a `covered: true`
# authority/retention entry (Compile rejects the combination otherwise).
registry: hcmnext.schemaflux.registries
registry_version: 1
source_contract: internal/intent/model (authorityCatalog, retentionCatalog)

