# Deferred-domain SchemaFlux sources (MSRC-006).
#
# These are reviewed conformance vocabulary only. Every definition is DRAFT,
# uncovered, and read-model shaped; EXTERNAL_OBSERVATION is an explicit
# authority gate and must not be interpreted as a production mutation boundary.
# They are intentionally outside entities/v1 so MSRC-007 cannot publish them
# until each domain receives a funded Go model and authority registration.
family: deferred
family_version: 1
source_docs:
  - planning/data/models/rewards-payroll-workforce.md
  - planning/data/models/talent-experience-cases.md
  - planning/data/models/assurance-intelligence-platform.md
entities:
  - name: PayrollSource
    version: 1
    key: payroll_source
    owner_domain: PAYROLL
    class: READ_MODEL
    status: DRAFT
    covered: false
    tenant_scoped: true
    lifecycle_assignment: NO_BUSINESS_LIFECYCLE
    command_boundary: EXTERNAL_OBSERVATION
    source_ref: planning/data/models/rewards-payroll-workforce.md#payroll
    summary: Deferred payroll enrollment, calculation and settlement vocabulary.
    properties:
      - name: source_key
        go_type: string
        schema_path: hcmnext.deferred.v1.PayrollSource.source_key
        presence: REQUIRED
        classification: COMPENSATION
        temporal: EFFECTIVE_DATED
        authority_ref: authority.compensation_extension/v1
        correction: SUPERSEDES
        retention_class_ref: COMPENSATION_RECORD
        status: DRAFT
