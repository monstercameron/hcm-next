# people entity sources (MSRC-004).
#
# `covered: true` entities/properties/relationships here must match, field
# for field, internal/intent/model/catalog.go's compiled
# internal/intent/model.Catalog() registry (MSRC-002's Go anchor).
# tools/gen/schemaflux/sources.CrossCheckModel enforces this; a mismatch is
# reported, never silently accepted (per this repo's cross-check mandate).
#
# `covered: false` entities are drawn from people-workforce.md's party/worker/employment/organization sections with no
# funded Go registration yet (see planning/data/models/README.md's coverage
# rule: "Coverage is claimed only for the fourteen drafted definitions...
# Everything else... carries no coverage claim"). They are encoded here so a
# future funded domain starts from a reviewed source rather than
# re-transcribing prose, and so the loader's cross-reference resolution has
# real, non-trivial structure to validate against. A `covered: false` entity
# or property must not declare status ACTIVE.

family: people
family_version: 1
source_docs:
  - planning/data/models/people-workforce.md#party-and-identity
  - planning/data/models/people-workforce.md#worker-and-employment
  - planning/data/models/people-workforce.md#organizations-legal-entities-and-relationships
entities:
  - name: Person
    version: 1
    key: person
    aliases: []
    owner_domain: PEOPLE
    class: AGGREGATE_ROOT
    status: ACTIVE
    covered: true
    tenant_scoped: true
    lifecycle_assignment: RevisionedFactLifecycle
    command_boundary: LOCAL_ACID
    stream_kind: PERSON
    invariants:
      - invariant.person_identity_unique/v1
    source_ref: planning/data/models/people-workforce.md#party-and-identity
    summary: >-
      Party root: preferred/legal names, demographic facts, contact points, addresses and identity links.
    properties:
      - name: identity
        go_type: string
        schema_path: hcmnext.people.v1.Person.identity
        presence: REQUIRED
        classification: PII
        temporal: POINT_IN_TIME
        authority_ref: authority.person/v1
        correction: SUPERSEDES
        retention_class_ref: WORKER_TRANSACTION
        status: ACTIVE
      - name: lifecycle_state
        go_type: string
        schema_path: hcmnext.people.v1.Person.lifecycle_state
        presence: REQUIRED
        classification: INTERNAL
        temporal: EFFECTIVE_DATED
