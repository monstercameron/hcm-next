# kernel entity sources (MSRC-003).
#
# `covered: true` entities/properties/relationships here must match, field
# for field, internal/intent/model/catalog.go's compiled
# internal/intent/model.Catalog() registry (MSRC-002's Go anchor).
# tools/gen/schemaflux/sources.CrossCheckModel enforces this; a mismatch is
# reported, never silently accepted (per this repo's cross-check mandate).
#
# `covered: false` entities are drawn from planning/data/models/kernel-governance-and-evidence.md's intent and transaction kernel section with no
# funded Go registration yet (see planning/data/models/README.md's coverage
# rule: "Coverage is claimed only for the fourteen drafted definitions...
# Everything else... carries no coverage claim"). They are encoded here so a
# future funded domain starts from a reviewed source rather than
# re-transcribing prose, and so the loader's cross-reference resolution has
# real, non-trivial structure to validate against. A `covered: false` entity
# or property must not declare status ACTIVE.

family: kernel
family_version: 1
source_docs:
  - planning/data/models/kernel-governance-and-evidence.md#intent-and-transaction-kernel
entities:
  - name: IntentInstance
    version: 1
    key: intent_instance
    aliases: [BusinessIntent]
    owner_domain: GOVERNANCE
    class: AGGREGATE_ROOT
    status: ACTIVE
    covered: true
    tenant_scoped: true
    lifecycle_assignment: RequestLifecycle
    command_boundary: CROSS_AGGREGATE_TRANSACTION
    stream_kind: TRANSACTION
    invariants:
      - invariant.intent_five_dimensions/v1
    source_ref: planning/data/models/kernel-governance-and-evidence.md#intent-and-transaction-kernel
    summary: >-
      Platform intent identity: subtype registration, subject/scope, request payload digest and the five lifecycle dimensions coordinating a governed request end to end.
    properties:
      - name: lifecycle
        go_type: lifecycle.Dimensions
        schema_path: hcmnext.intents.v1.IntentInstance.lifecycle
        presence: REQUIRED
        classification: INTERNAL
        temporal: POINT_IN_TIME
        authority_ref: authority.intent_instance/v1
        correction: APPENDS_CORRECTION
        retention_class_ref: GOVERNANCE_EVIDENCE
        status: ACTIVE
      - name: definition_ref
        go_type: string
        schema_path: hcmnext.intents.v1.IntentInstance.definition_ref
        presence: REQUIRED
        classification: INTERNAL
        temporal: IMMUTABLE
        authority_ref: authority.intent_instance/v1
        correction: IMMUTABLE_NO_CORRECTION
        retention_class_ref: GOVERNANCE_EVIDENCE
        status: DRAFT
      - name: idempotency_key
        go_type: string
        schema_path: hcmnext.intents.v1.IntentInstance.idempotency_key
        presence: REQUIRED
        classification: INTERNAL
        temporal: IMMUTABLE
        authority_ref: authority.intent_instance/v1
        correction: IMMUTABLE_NO_CORRECTION
        retention_class_ref: GOVERNANCE_EVIDENCE
        status: DRAFT

