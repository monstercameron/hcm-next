# evidence entity sources (MSRC-003).
#
# `covered: true` entities/properties/relationships here must match, field
# for field, internal/intent/model/catalog.go's compiled
# internal/intent/model.Catalog() registry (MSRC-002's Go anchor).
# tools/gen/schemaflux/sources.CrossCheckModel enforces this; a mismatch is
# reported, never silently accepted (per this repo's cross-check mandate).
#
# `covered: false` entities are drawn from kernel-governance-and-evidence.md's ledger/effects/observation/repair section with no
# funded Go registration yet (see planning/data/models/README.md's coverage
# rule: "Coverage is claimed only for the fourteen drafted definitions...
# Everything else... carries no coverage claim"). They are encoded here so a
# future funded domain starts from a reviewed source rather than
# re-transcribing prose, and so the loader's cross-reference resolution has
# real, non-trivial structure to validate against. A `covered: false` entity
# or property must not declare status ACTIVE.

family: evidence
family_version: 1
source_docs:
  - planning/data/models/kernel-governance-and-evidence.md#ledger-effects-observation-and-repair
entities:
  - name: EvidenceRecord
    version: 1
    key: evidence_record
    aliases: []
    owner_domain: GOVERNANCE
    class: EVIDENCE
    status: ACTIVE
    covered: true
    tenant_scoped: true
    lifecycle_assignment: ImmutableEvidenceLifecycle
    source_ref: planning/data/models/kernel-governance-and-evidence.md#ledger-effects-observation-and-repair
    summary: >-
      One immutable evidence artifact: subject/issuer/holder refs, evidence type, canonical digest and validity interval.
    properties:
      - name: digest
        go_type: string
        schema_path: hcmnext.intents.v1.EvidenceRecord.digest
        presence: REQUIRED
        classification: INTERNAL
        temporal: IMMUTABLE
        authority_ref: authority.evidence_record/v1
        correction: IMMUTABLE_NO_CORRECTION
        retention_class_ref: GOVERNANCE_EVIDENCE
        status: ACTIVE

  - name: Observation
    version: 1
    key: observation
    aliases: []
    owner_domain: OPERATIONS
    class: EVIDENCE
    status: ACTIVE
    covered: true
    tenant_scoped: true
    lifecycle_assignment: ImmutableEvidenceLifecycle
    source_ref: planning/data/models/kernel-governance-and-evidence.md#ledger-effects-observation-and-repair
    summary: >-
      A completeness-scored external read: source/connection/source-role, canonical resource link and PASS/FAIL/UNKNOWN/PARTIAL promotion policy.
    properties:
      - name: observed_state
        go_type: string
        schema_path: hcmnext.intents.v1.Observation.observed_state
        presence: REQUIRED
        classification: INTERNAL
        temporal: POINT_IN_TIME
        authority_ref: authority.observation/v1
        correction: APPENDS_CORRECTION
        retention_class_ref: OPERATIONAL_EVIDENCE
        status: ACTIVE

  - name: RepairPlan
    version: 1
