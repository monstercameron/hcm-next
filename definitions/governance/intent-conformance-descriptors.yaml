# Intent Conformance Descriptors
# Generated from the Business Intent Catalog initial draft-contract slice.
# This manifest provides exactly fourteen finite conformance descriptors for the
# initial intended definitions. Each descriptor includes required sections: family,
# entities/properties, reads/writes/effects, authority, time, five-dimension
# lifecycle, evidence, negative-policy matrix, scenario, and phase depth.

descriptors:
  - intent_type_id: hcmnext.people.change_manager
    version: 1
    display_name: ChangeManager
    family: CHANGE_REQUEST
    side_effect_profile: INTERNAL_MUTATION
    phase: DESIGN_CONFORMANCE_ONLY
    entities:
      - Worker
      - manager_relationship
      - organization_unit
    properties:
      - effective_date
      - reason_code
      - material_input
      - delegation_chain
    reads:
      - authoritative_worker_state
      - organization_graph
      - conflict_cache
    writes:
      - none
    effects:
      - policy_effects
      - relationship_effects
      - observation_effects
    authority:
      - tenant_policy
      - initiator_authority
      - approval_authority
      - organization_scope
    time:
      - effective_at
      - recorded_at
    lifecycle:
      request: DRAFT -> SUBMITTED -> PREFLIGHT -> APPROVED -> SCHEDULED -> EXECUTING -> COMPLETED
      execution: NOT_STARTED -> RUNNING -> OBSERVED -> SETTLED -> RECONCILED
      business: PENDING -> ACTIVE -> CLOSED
      consistency: NOT_COMPARED -> COMPARING -> CONSISTENT -> DRIFT -> UNKNOWN
      obligation: PENDING -> DISCHARGED -> WAIVED -> BLOCKED
    evidence:
      - request_digest
      - decision_or_result
      - provenance
      - conflict_resolution
    negative_policy:
      - condition: unauthorized_initiator_or_stale_delegation
        disposition: REJECT
      - condition: circular_relationship_or_invalid_graph
        disposition: REPLAN
      - condition: missing_required_approval_authority
        disposition: FAIL_CLOSED
      - condition: materially_changed_facts_at_revalidation
        disposition: REPLAN_AND_REAPPROVE
    scenario:
      name: conformance-fixture-isolated-graph-change
      given: valid worker, eligible incoming manager, no conflicts, conformance-only execution mode
      when: a change-manager intent is submitted with valid proposal and approval binding
      then: fixture returns exact APPROVED/REJECTED state without creating production relationship mutations
    conformance_only: true

  - intent_type_id: hcmnext.people.explain_worker_state
    version: 1
    display_name: ExplainWorkerState
    family: ANALYTICAL_REQUEST
    side_effect_profile: READ_ONLY
    phase: GATE_A
    entities:
      - Worker
      - Employment
      - Assignment
      - state_snapshot
    properties:
      - effective_at
      - include_redacted
      - material_input
    reads:
      - authoritative_worker_state
      - source_authority
      - organization_graph
    writes:
      - none
    effects:
      - none
    authority:
      - tenant_policy
      - initiator_authority
      - purpose_and_context
    time:
      - effective_at
      - known_at
      - recorded_at
    lifecycle:
      request: SUBMITTED -> EXECUTING -> COMPLETED
      execution: RUNNING -> OBSERVED -> SETTLED
      business: PENDING -> RESOLVED
      consistency: IMMEDIATE
      obligation: IMMEDIATE
    evidence:
      - request_digest
      - decision_or_result
      - provenance
      - denied_access
    negative_policy:
      - condition: caller_lacks_read_authorization
        disposition: DENY_WITH_NO_DISCLOSURE
      - condition: requested_fields_are_withheld
        disposition: RETURN_PRESENCE_ONLY
      - condition: effective_at_is_future_unknown_or_stale
        disposition: RETURN_UNCERTAINTY
    scenario:
      name: canonical-read-authorized-facts
      given: valid worker, authorized initiator, pinned effective date, proper authority snapshot
      when: an explain_worker_state intent is submitted
      then: result returns exact typed authorized facts with revision, presence, source authority and provenance; denied fields return non-disclosing state; zero writes/effects

