# Physical storage-disposition registry (STORE-001).
#
# Every base table declared by migrations/*.sql must have exactly one entry
# here, and every entry here must name a table that actually exists in the
# live schema; internal/data/tenancy/storagedisposition's registry_test.go
# (TestTodo_STORE_001 and its matrix) proves both directions against
# internal/data/pgtest's real, fully migrated PostgreSQL schema, so this file
# cannot drift silently from the schema it describes. The loader lives under
# internal/data/tenancy/storagedisposition rather than here because
# definitions/ is declared never-executable
# (definitions/architecture/repository-layout.yaml).
#
# Scope. This registry covers the data plane's own physical base tables —
# the ones migrations/*.sql creates directly in the schema Goose applies into
# (current_schema()). It does not yet enumerate caches, search indexes or
# telemetry stores (planning/todos.md's fuller STORE-001 RED clause), because
# none of those exist as separate physical systems in this phase; when one is
# introduced, it gets a row here the same way a table does.
#
# migrations/00010_artifacts.sql's content-addressed artifact tables
# (artifact, artifact_reference_event, artifact_retrieval_refusal) are
# deliberately excluded: that migration creates them in a separate PostgreSQL
# schema precisely so they never enter current_schema()'s base-table set
# (its own header comment explains why, citing the same frozen
# internal/data/schema golden test this registry's own tests route around by
# living outside definitions/). They are out of the "live schema" this
# registry is checked against, not merely unregistered.
#
# A table's physical partitions (ledger_event_p0..p3) are not listed
# separately: they are physical storage for their single logical table, not
# distinct authoritative stores, and pg_class flags them relispartition so a
# live-schema walk excludes them the same way internal/data/schema's own
# baseTables() helper does.

version: 1
module: github.com/monstercameron/hcm-next
source: migrations/00001_platform_control.sql .. migrations/00009_promotion_seed_registries.sql

disposition: >-
  Every row is either PERMANENT (an append-only historical or evidentiary
  record: the table is itself the source of truth and is never truncated or
  rebuilt from anything else), OPERATIONAL (live, mutable serving state that
  is authoritative for its own column values but does not carry irreplaceable
  history), or REBUILDABLE (derived, resumable state that a documented
  rebuild_source can reconstruct from scratch with no loss of authoritative
  fact -- 00006's own comment calls projection_checkpoint and outbox exactly
  this). No table in this phase carries column-level encryption beyond
  whatever the deployment's disk/volume layer provides, so every
  encryption_class is currently PLATFORM_MANAGED; a table gaining a
  sensitive, individually-encrypted column moves to FIELD_LEVEL and that
  change must land in the same commit as the schema change that requires it.

retention_classes:
  - name: PERMANENT
    description: >-
      Append-only; the table is the source of truth for its own history and
      is never truncated. Enforced in the schema by the forbid_mutation
      trigger where one is attached (definition_version, proposal_revision,
      ledger_event, external_observation); schema_release and
      migration_journal are permanent by convention and by the DB-006
      contract in internal/data/schema/journal.go, not by a trigger.
  - name: OPERATIONAL
    description: >-
      Mutable, live-serving state. Authoritative for its current column
      values, but not itself a rebuildable derivative of another table.
  - name: REBUILDABLE
    description: >-
      Derived, resumable progress state. rebuild_source names the
      append-only table it can be fully reconstructed from; losing a
      REBUILDABLE table's rows is an availability incident, never a data-loss
      incident.

encryption_classes:
  - name: PLATFORM_MANAGED
    description: >-
      Relies on the deployment's disk/volume/backup encryption; no
      column-level cryptography inside this table.
  - name: FIELD_LEVEL
    description: >-
      Carries at least one individually encrypted column. Not used by any
      table in this phase; reserved for when one is added.

# data_role classifies what part of the DATA plane architecture
# (planning/specs/platform-plane-model.md) a table plays in: LEDGER (the
# append-only fact stream and its stream/authority/schema registries),
# PROJECTION or OUTBOX (the two rebuildable subplanes 00006 introduces),
# REGISTRY (a versioned control-plane definition/pointer table), or CONTROL
# (platform bookkeeping that is neither a business fact nor a serving view).
