    isolation_package: internal/data/tenancy
    append_only: true
    retention_class: PERMANENT
    encryption_class: PLATFORM_MANAGED
    rebuild_source: null
    notes: >-
      DATA-004: a tamper-evident hash chain over ledger_event, one link per
      (tenant, stream_key, sequence): chain_hash[n] folds chain_hash[n-1]
      together with that event's own digest. Mechanically it IS a pure
      function of ledger_event's stored digests, so a naive reading would call
      it REBUILDABLE the way stream_head is -- but that classification is
      deliberately not used here: silently regenerating the chain from
      ledger_event's *current* contents would recompute a self-consistent
      chain over whatever is there after the fact, defeating the one property
      this table exists to provide (proof that no event was deleted,
      reordered or altered since it was appended -- see
      internal/data/ledger/hashchain's own doc.go). It is therefore PERMANENT
      like ledger_event itself, enforced by the same forbid_mutation trigger,
      and its "rebuild" path is a from-scratch chain plus an explicit
      mismatch report (internal/data/ledger/hashchain.Verify), never a quiet
      replacement.

