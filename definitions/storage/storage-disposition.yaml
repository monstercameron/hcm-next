    migration: 00001_platform_control.sql
    owner_package: internal/data/schema
    plane: DATA
    data_role: CONTROL
    tenant_scoping_column: null
    append_only: false
    retention_class: PERMANENT
    encryption_class: PLATFORM_MANAGED
    rebuild_source: null
    notes: >-
      Not tenant scoped by design (DATA-001): it describes the schema itself,
      not a tenant's business truth. One row per released schema artifact
      digest (DB-006).

