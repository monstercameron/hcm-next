todo: UX-QUAL-001
workspace: Promotion request, approval and timeline workspace (UX-001 contract)
decision_date: "2026-09-03"
review_by: "2026-10-03"
selected_renderer: gwc

summary: >-
  Both the GWC (GoWebComponents v5.0.1) renderer and the Go html/template SSR
  fallback pass every UX-QUAL-001 criterion against the UX-001 workspace
  contract fixture (tools/uxqual/testdata). Per the go-only technology
  constitution ("GWC owns the browser and presentation runtime when
  qualified"), GWC is pinned as the renderer. The SSR renderer
  (tools/uxqual/render/ssr) is kept and stays green in the same fixture as
  the named fallback; it ships if a later re-run regresses GWC's score.

method: >-
  tools/uxqual/qual.TestWorkspaceQualificationFixture renders the same
  masked WorkspaceContract fixture (tools/uxqual/testdata/fixture.go) through
  both renderers and scores six gates: Buildable, Keyboard-only completion,
  Screen-reader semantics, WCAG 2.2 AA contrast, Reflow at 320px, and Never
  renders a masked field. GWC's structural criteria are scored against the
  document its own native SSR path (ui.RenderToString) produces from the
  exact same component tree tools/uxqual/render/gwc/mount_wasm.go mounts
  live in a browser -- not a separate hand-authored document. Re-run with:
  `go test -count=1 ./tools/uxqual/qual/...`.

candidates:
  gwc:
    package: github.com/monstercameron/hcm-next/tools/uxqual/render/gwc
    criteria:
      - name: "Buildable (GOOS=js GOARCH=wasm)"
        pass: true
        detail: >-
          `GOOS=js GOARCH=wasm go build ./tools/uxqual/render/gwc/...`
          succeeds. This depends on go.mod/go.sum already carrying entries
          for GWC v5.0.1's transitive dependencies
          (github.com/fxamacker/cbor/v2, github.com/yuin/goldmark), added by
          another lane's work on 2026-09-03; this lane does not edit
          go.mod/go.sum. If a future go.sum change removes those entries,
          this criterion and the fixture will fail again and this decision
          must be re-run.
      - name: "Keyboard-only completion"
        pass: true
        detail: >-
          12 natively-focusable controls (native <input>/<textarea>/
          <button>/<a href>) in DOM order, zero positive tabindex. DOM order
          equals the WorkspaceContract.Request.Fields/Actions order, so tab
          order is derivable from the contract alone.
      - name: "Screen-reader semantics"
        pass: true
        detail: >-
          Landmarks present (header=1 [banner], nav=1, main=1,
          footer=1 [contentinfo]); all 5 rendered inputs have a matching
          <label for>; one live region (role="status" aria-live="polite")
          on the simulation status banner.
      - name: "WCAG 2.2 AA contrast"
        pass: true
        detail: >-
          Renderer-independent: both renderers import
          tools/uxqual/tokens.Palette. All 11 foreground/background pairs
          tools/uxqual/tokens.TextPairs declares are >= 4.5:1 (WCAG 2.2 AA,
          1.4.3), computed by tools/uxqual/tokens.ContrastRatio.
      - name: "Reflow at 320px"
        pass: true
        detail: >-
          No bare `width:<n>px` declaration in the emitted stylesheet
          (tools/uxqual/tokens.WorkspaceCSS, shared verbatim by both
          renderers) exceeds 320px; layout uses rem/%/max-width, and the one
          grid breakpoint only adds columns above 640px.
      - name: "Never renders a masked field"
        pass: true
        detail: >-
          The fixture's masked field (nationalId) and masked action
          (force_execute) are absent from GWC's rendered document. GWC's
          renderer (tools/uxqual/render/gwc/renderer.go) only ever consumes
          contract.WorkspaceContract -- it does not import or reference
          contract.SourceRecord's AllFields/AllActions, so it structurally
          cannot render what it never receives (checked by source-text scan
          in TestTodo_UX_QUAL_001_Security).
    notes: >-
      GWC has no raw-text/innerHTML sink by design (see
      github.com/monstercameron/GoWebComponents/v5/html/raw_html.go's doc
      comment), so a literal CSS blob cannot be a text child in the
      component tree without being HTML-entity-escaped. The workspace
      stylesheet is therefore assembled as a plain string
      (tools/uxqual/render/gwc.Stylesheet/Document), mirroring how GWC's own
      css.CriticalCSS()/StyleBlock() are documented to work (string
      concatenation into the SSR head, not a node).

  ssr:
    package: github.com/monstercameron/hcm-next/tools/uxqual/render/ssr
    criteria:
      - name: "Buildable (native)"
        pass: true
        detail: "`go build ./tools/uxqual/render/ssr/...` succeeds; no external runtime dependency beyond the Go standard library and tools/uxqual/tokens."
      - name: "Keyboard-only completion"
        pass: true
        detail: "13 natively-focusable controls in DOM order, zero positive tabindex."
      - name: "Screen-reader semantics"
        pass: true
        detail: 'Landmarks present (header=1, nav=1, main=1, footer=1); all 5 rendered inputs labeled; one live region (role="status" aria-live="polite").'
      - name: "WCAG 2.2 AA contrast"
        pass: true
        detail: "Same shared token palette as GWC; all 11 pairs >= 4.5:1."
      - name: "Reflow at 320px"
        pass: true
        detail: "Same shared stylesheet (tools/uxqual/tokens.WorkspaceCSS) as GWC; no fixed width exceeds 320px."
      - name: "Never renders a masked field"
        pass: true
        detail: "The masked field/action are absent; the SSR renderer (tools/uxqual/render/ssr/ssr.go) only consumes contract.WorkspaceContract, never contract.SourceRecord."
    notes: >-
      Ships with zero JavaScript: every action is a native <form>/<button>
      full-page POST. This is the P1B fallback the go-only technology
      constitution names if GWC ever regresses; it is exercised by the same
      fixture on every run, not revisited only when GWC fails.

browser_pass:
  date: "2026-09-03"
  playwright_version: "1.60.0"
  chromium_version: "148.0.7778.96 (Chrome for Testing, playwright chromium build v1223)"
  command: >-
    go run ./tools/uxqual/cmd/genfixtures &&
    npx playwright test -c tools/uxqual/browser/playwright.config.mjs
  spec: tools/uxqual/browser/workspace.a11y.spec.mjs
  fixtures: tools/uxqual/testdata/rendered/{ssr,gwc}.html
  result: "10/10 passed"
  notes: >-
    Chromium for the pinned @playwright/test build was not present under
    %LOCALAPPDATA%\ms-playwright (only revisions 1200/1217/1228/1234 were
    cached; the pinned build is 1223). `npx playwright install chromium`
    against that shared cache blocked on %LOCALAPPDATA%\ms-playwright\__dirlock,
    held for 6+ hours by another concurrent session's install
    (node ... @playwright/test/cli.js install chromium, PID 31880, started
    2026-09-02 22:36) that was still present in `tasklist`/Get-Process
    throughout, so per this lane's constraint the lock was left untouched
    and not removed. Installed Chromium instead to an isolated
    PLAYWRIGHT_BROWSERS_PATH (outside %LOCALAPPDATA%\ms-playwright, so no
    contention with the other session's cache or lock) and ran both
    `playwright install chromium` and `playwright test` with that env var
    set. A first full run (default fullyParallel, 9 workers) reported 9
    passed / 1 failed: `ssr renderer > every visible field has an
    accessible name from its label` failed on
    "Test timeout of 30000ms exceeded while setting up 'page'" -- a
    headless-shell launch timeout, not a failed assertion (the test never
    reached its expect() calls) -- consistent with this being a shared
    machine already running 30+ unrelated chrome.exe/node.exe processes
    from other sessions. Re-ran with `retries: 1` and `workers: 1` added to
    tools/uxqual/browser/playwright.config.mjs (a spec-side resilience fix
    for environment contention, not a weakened assertion) and all 10 tests
    passed on the first attempt with no retry consumed, confirming the
    single failure was launch-timing flake, not a real accessibility
    defect.
  criteria:
    ssr:
      - name: "Never renders a masked field"
        pass: true
        detail: >-
          content() for ssr.html contains none of nationalId, 555-11-2222,
          force_execute, "Force execute".
      - name: "Screen-reader semantics -- landmarks + live region"
        pass: true
        detail: >-
          Chromium's computed accessibility tree exposes banner, main, and
          navigation roles, plus one visible role="status" live region.
      - name: "Screen-reader semantics -- label associations"
        pass: true
        detail: >-
          #proposedJobTitle, #proposedCompensation, #effectiveDate, and
          #businessReason each resolve a non-empty label[for] text via a
          real DOM query.
      - name: "Keyboard-only completion"
        pass: true
        detail: >-
          Real Tab-key traversal (page.keyboard.press) reaches all 4
          fixture fields in contract order (proposedJobTitle,
          proposedCompensation, effectiveDate, businessReason) with no
          trap, within 40 Tab presses.
      - name: "Reflow at 320px"
        pass: true
        detail: >-
          At a real 320x800 viewport, document.scrollWidth <=
          document.clientWidth + 1 (no horizontal overflow).
    gwc:
      - name: "Never renders a masked field"
        pass: true
        detail: >-
          content() for gwc.html contains none of nationalId, 555-11-2222,
          force_execute, "Force execute".
      - name: "Screen-reader semantics -- landmarks + live region"
        pass: true
        detail: >-
          Chromium's computed accessibility tree exposes banner, main, and
          navigation roles, plus one visible role="status" live region.
      - name: "Screen-reader semantics -- label associations"
        pass: true
        detail: >-
          #proposedJobTitle, #proposedCompensation, #effectiveDate, and
          #businessReason each resolve a non-empty label[for] text via a
          real DOM query.
      - name: "Keyboard-only completion"
        pass: true
        detail: >-
          Real Tab-key traversal reaches all 4 fixture fields in contract
          order with no trap, within 40 Tab presses.
      - name: "Reflow at 320px"
        pass: true
        detail: >-
          At a real 320x800 viewport, document.scrollWidth <=
          document.clientWidth + 1 (no horizontal overflow).

