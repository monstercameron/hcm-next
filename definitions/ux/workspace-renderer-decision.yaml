rationale: >-
  The go-only technology constitution states a preference is not a
  dependency: GWC ships only after passing this fixture. It now does, on
  the real component tree tools/uxqual/render/gwc/renderer.go builds and
  tools/uxqual/qual scores on every `go test` run (not a one-time manual
  check), so re-qualification is automatic and continuous rather than a
  point-in-time audit. The Go SSR fallback is not deleted or deprioritized:
  it is scored by the identical fixture on the identical contract, so a
  future GWC regression has a proven, currently-green landing spot with no
  extra work at that time.
