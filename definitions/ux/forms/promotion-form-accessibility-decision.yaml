      planning/todos.md, 2026-09-02). Add one if a later phase reintroduces
      a form-backed human-work task for this request type.
    status: PENDING
    owner: TBD
  - item: >-
      200% text zoom and a real assistive-technology (NVDA/VoiceOver) pass
      against the rendered Promotion form are not exercised here, matching
      the same PENDING items definitions/ux/workspace-renderer-decision.yaml
      already records for the same underlying documents -- this lane adds
      no new automated coverage for those two, only the two named criteria
      above.
    status: PENDING
    owner: TBD
  - item: >-
      Re-run if tools/uxqual/render/gwc is ever changed by another lane: if
      it starts setting the native `required` attribute and
      aria-invalid/aria-describedby, gwc_known_gaps above and
