# No real external-write-adapter package exists anywhere in this repository
# yet (P1A is read-only by construction; NEXT-005's evidence proves it down
# to zero effect rows under retry/crash). These prefixes name the P1B write-
# adapter package tree next-steps.md's P1B section describes
# (promote_worker/EXECUTE, change_base_pay, reserve/release_compensation_budget,
# approve/reject_proposal) that must not exist yet and therefore must never
# be importable by a P1A evidence package. Because they name no package that
# exists today, a real evidence entry above can only ever be flagged
# EFFECTFUL if it starts importing one of these once it is built - this is
# proven against a synthetic fixture, not a real import, in
# compiler_test.go's TestP1AEvidenceCompilerRejectsMissingStaleOutOfManifestOrEffectfulEvidence.
forbidden_import_prefixes:
  - github.com/monstercameron/hcm-next/internal/connectivity/writeadapters
  - github.com/monstercameron/hcm-next/internal/transport/clients/providerwrite
  - github.com/monstercameron/hcm-next/internal/domains/promotion/execute

