# P1A delivery manifest (NEXT-002).
#
# Schema: tools/planning/gateevidence.P1AManifest. Compiled by
# tools/planning/gateevidence.Compile (NEXT-003) against
# definitions/planning/gates/p1a-evidence-results.json, rendering
# definitions/planning/gates/p1a-evidence-report.{md,json}.
#
# This is the selection-bound P1A release manifest: exactly the eight
# executable intent contracts, the ten bootstrap capabilities, the four
# commands, the fourteen embedded migrations (plus one recorded numbering
# gap), the four toolchain qualification decisions and the six todos' proof
# tests that next-steps.md's "P1A - paid observation, preflight and
# simulation" section names. Its sibling, deferred P1B manifest is
# definitions/planning/gates/p1b-template.yaml.
#
# CanonicalDigest hashes every field below except `signature`; do not hand-
# edit any field above `signature` without re-signing (see
# manifest_test.go's TestP1AAndP1BManifestsAreDisjointOrderedBoundedAndSelectionComplete
# and TestTamperedP1AManifestFailsSignatureVerification for what breaks).
schema_version: 1
release: P1A
todo_id: NEXT-002
signed_date: "2026-09-03"
freshness_window_days: 30
workflow: promotion.preflight-simulate-observe/v1

# The eight P1A executable intent contracts, in next-steps.md's exact order.
# ExecutionState never leaves NOT_PLANNED in P1A (next-steps.md P1A).
intents:
  - order: 1
    id: hcmnext.people.explain_worker_state/v1
    disposition: INCLUDED
  - order: 2
    id: hcmnext.people.promote_worker/v1
    modes: [DRAFT, PREFLIGHT, SIMULATE]
    disposition: INCLUDED
  - order: 3
    id: hcmnext.rewards.simulate_compensation/v1
    disposition: INCLUDED
  - order: 4
    id: hcmnext.rewards.evaluate_pay_band_position/v1
    disposition: INCLUDED
  - order: 5
    id: hcmnext.intelligence.explain_transaction/v1
    disposition: INCLUDED
  - order: 6
    id: hcmnext.operations.detect_drift/v1
    disposition: INCLUDED
  - order: 7
    id: hcmnext.operations.create_repair_plan/v1
    modes: [RECOMMENDATION_ONLY]
    disposition: INCLUDED
  - order: 8
    id: hcmnext.operations.simulate_repair/v1
    disposition: INCLUDED

# The hard zero-effect ceiling P1A may never cross (next-steps.md P1A,
# verbatim). NEXT-005's evidence (test/bootstrap) proves this ceiling holds
# for the Promotion path under retry and crash.
effect_ceiling:
  - "zero worker, employment, assignment, organization, position, compensation or budget mutations"
  - "zero reservations, WorkItems and timers"
  - "zero committed external effects, provider writes and MessageIntents"

# The ten bootstrap capability-registry entries (internal/capability/bootstrap.go
# bootstrapDefinitions), copied field-for-field from
# tools/gen/schemaflux/testdata/capability_manifest.yaml, which TOOL-004's own
# test cross-checks against that live table on every run. Every one is
# READ_ONLY; P1A grants no other effect class (enforced by
# P1AManifest.Validate).
capabilities:
  - id: hcmnext.people.explain_worker_state
    version: 1
    owner_domain: people
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.people.explain_worker_state/v1"
  - id: hcmnext.people.promote_worker
    version: 1
    owner_domain: people
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.people.promote_worker/v1"
  - id: hcmnext.rewards.simulate_compensation
    version: 1
    owner_domain: rewards
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.rewards.simulate_compensation/v1"
  - id: hcmnext.rewards.evaluate_pay_band_position
    version: 1
    owner_domain: rewards
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.rewards.evaluate_pay_band_position/v1"
  - id: hcmnext.intelligence.explain_transaction
    version: 1
    owner_domain: intelligence
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.intelligence.explain_transaction/v1"
  - id: hcmnext.operations.detect_drift
    version: 1
    owner_domain: operations
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.operations.detect_drift/v1"
  - id: hcmnext.operations.create_repair_plan
    version: 1
    owner_domain: operations
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.operations.create_repair_plan/v1"
  - id: hcmnext.operations.simulate_repair
    version: 1
    owner_domain: operations
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.operations.simulate_repair/v1"
  - id: hcmnext.registry.resolve_capability
    version: 1
    owner_domain: registry
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.registry.resolve_capability/v1"
  - id: hcmnext.registry.explain_capability
    version: 1
    owner_domain: registry
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.registry.explain_capability/v1"

# The four P1A composition-root binaries (NEXT-004).
commands:
  - name: hcmnext
    package: cmd/hcmnext
    purpose: "Composition root: prints build identity, or `serve` runs the P1A cell (gRPC + connect-go HTTP edge) over internal/intent/app.NewCell."
  - name: worker
    package: cmd/worker
    purpose: "Composition root running the transactional outbox consumer (internal/data/outbox) sweep loop."
  - name: projector
    package: cmd/projector
    purpose: "Composition root running the projection reconciler (internal/data/projection) loop."
  - name: migrate
    package: cmd/migrate
    purpose: "Composition root applying the embedded Goose migration tree (migrations/) with DB-006 journaling."

